name: Build APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      
      - name: Build APK with Kivy Buildozer
        uses: arturbosch/kivy-action@v1.0.1
        with:
          command: buildozer apk debug
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AutoClicker
          path: bin/*.apk
