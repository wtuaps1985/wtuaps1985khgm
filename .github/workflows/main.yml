name: Build APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      
      - name: Build APK using official Kivy Docker
        run: |
          docker run --rm -v "${GITHUB_WORKSPACE}":/home/user/app kivy/buildozer:latest bash -c "cd /home/user/app && buildozer apk debug"
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AutoClicker
          path: bin/*.apk
