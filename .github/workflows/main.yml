name: Build APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      
      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.8'
      
      - name: Install dependencies
        run: |
          pip install buildozer==1.6.0
          pip install kivy
          pip install pillow
      
      - name: Build APK
        run: |
          buildozer apk debug
      
      - name: Upload APK
        uses: actions/upload-artifact@v2
        with:
          name: AutoClicker
          path: bin/*.apk
